CONFIG_IPM=y
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# buttons and touch
CONFIG_INPUT=y
CONFIG_GPIO=y

# RTC and IMU
CONFIG_RTC=y
CONFIG_SENSOR=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# mics (ES7210) over I2S; ES8311 is configured too but the amp stays off
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_DMA=y

# TF card (SDMMC) + FAT
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_SHELL=y
